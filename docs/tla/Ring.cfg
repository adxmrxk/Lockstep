\* Two publishers on one topic, one subscriber, a two-slot ring and four
\* publications. Small on purpose: a two-slot ring laps almost immediately, so
\* the overrun and torn-read paths are reached in nearly every behaviour rather
\* than being a rare corner.
CONSTANTS
  Capacity  = 2
  MaxTicket = 4
  Pubs      = {p1, p2}
  Subs      = {s1}

SPECIFICATION Spec

INVARIANT NoTornRead
INVARIANT CursorBounded
